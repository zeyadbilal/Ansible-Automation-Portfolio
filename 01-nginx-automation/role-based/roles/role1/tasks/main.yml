- name: install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: copy nginx config file
  template:
    src: "{{ page_folder }}/nginx.conf.j2"
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: copy the web page
  template:
    src: '{{ page_folder }}/{{ item }}.j2'
    dest: /var/www/html/{{ item }}
  loop: "{{ web_page }}"
  notify: restart nginx
